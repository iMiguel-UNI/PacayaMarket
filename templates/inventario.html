{% extends "base.html" %}

{% block titulo %}Control de Stock{% endblock %}

{% block contenido %}
<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 style="color: #0f172a; margin: 0; font-size: 18px;">Inventario Principal</h3>
        <button class="btn"><i class="fa-solid fa-plus"></i> Nuevo Producto</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Cód</th>
                <th>Producto</th>
                <th>Categoría</th>
                <th>Precio (C$)</th>
                <th>Stock</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td style="font-weight: bold; color: #94a3b8;">#001</td>
                <td style="font-weight: 600;">Coca-Cola 3 Litros</td>
                <td>Bebidas</td>
                <td>85.00</td>
                <td style="font-weight: 600;">50</td>
                <td><span class="badge-success">Disponible</span></td>
                <td>
                    <button class="btn" style="padding: 6px 12px; background: #e2e8f0; color: #334155;"><i class="fa-solid fa-pen"></i></button>
                    <button class="btn btn-danger" style="padding: 6px 12px;"><i class="fa-solid fa-trash"></i></button>
                </td>
            </tr>
            <tr>
                <td style="font-weight: bold; color: #94a3b8;">#002</td>
                <td style="font-weight: 600;">Arroz Faisán 1lb</td>
                <td>Abarrotes</td>
                <td>22.00</td>
                <td style="font-weight: 600; color: #ef4444;">5</td>
                <td><span class="badge-warning">Reabastecer</span></td>
                <td>
                    <button class="btn" style="padding: 6px 12px; background: #e2e8f0; color: #334155;"><i class="fa-solid fa-pen"></i></button>
                    <button class="btn btn-danger" style="padding: 6px 12px;"><i class="fa-solid fa-trash"></i></button>
                </td>
            </tr>
        </tbody>
    </table>
</div>
{% endblock %}

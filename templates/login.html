<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Pacayita POS</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    
    <style>
        .login-wrapper { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: var(--sidebar-bg); }
        .login-card { background: white; padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
        
        .login-card h2 { color: var(--text-dark); margin-bottom: 30px; font-size: 28px; }
        .login-card h2 span { color: var(--accent); }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; color: #64748b; margin-bottom: 8px; }
        
        .form-control { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 15px; outline: none; transition: 0.3s; }
        .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        
        .btn-block { width: 100%; padding: 14px; font-size: 16px; margin-top: 10px; justify-content: center; }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <h2><i class="fa-solid fa-basket-shopping"></i> Pacayita<span>Market</span></h2>
            
            <form action="/login" method="POST">
                <div class="form-group">
                    <label>Usuario</label>
                    <input type="text" name="username" class="form-control" placeholder="Ej: miguel_admin" required>
                </div>
                
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn btn-block">Iniciar Sesión <i class="fa-solid fa-arrow-right"></i></button>
            </form>
        </div>
    </div>

</body>
</html>

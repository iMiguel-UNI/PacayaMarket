<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Punto de Venta - Pacayita</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="login">
  <div class="card">
    <h1>{{ n.nombre }} 🛒</h1>
    <p class="mut" style="text-align:center;margin:0 0 20px">Inicia sesión para abrir la caja</p>
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for c, m in msgs %}<div class="flash {{ c }}">{{ m }}</div>{% endfor %}
    {% endwith %}
    <form method="post">
      <label>Usuario</label><input name="usuario" autofocus required>
      <label style="margin-top:12px">Contraseña</label><input name="password" type="password" required>
      <button class="btn btn-ok" style="width:100%;margin-top:18px">Entrar</button>
    </form>
  </div>
</div>
</body>
</html>
